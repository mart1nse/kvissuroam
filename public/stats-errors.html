<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LINNARING script errors</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<style>
  /* Script errors from the game stats (worker/stats.js ?errors=1). Unlisted: taken off /stats on Martin's ask, 2026-11-24 */
  :root { --bg: #12062b; --panel: #1d0b44; --line: #34186e; --ink: #f6eaff; --ink2: #c7b3ec; --muted: #9581c2; --cyan: #2ff3ff; }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 22px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 16px; }
  h1 { margin: 0; font: 900 italic 28px/1 system-ui, sans-serif; }
  h1 a { color: var(--cyan); text-decoration: none; }
  .sub { color: var(--ink2); margin: 6px 0 0; font-size: 14px; }
  .range { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .range button { font: 600 13px system-ui, sans-serif; color: var(--ink2); background: none; border: 0; border-radius: 7px; padding: 7px 12px; cursor: pointer; }
  .range button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; width: 5em; }
  td code { color: var(--ink2); word-break: break-word; font-size: 12.5px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><a href="/stats">LINNARING</a> · SCRIPT ERRORS</h1>
      <p class="sub" id="sub">The most common script errors in the game, each counted once per visit.</p>
    </div>
    <div class="range" role="group" aria-label="Period">
      <button data-days="1">24 h</button><button data-days="7">7 days</button><button data-days="30">30 days</button><button data-days="90">90 days</button>
    </div>
  </header>
  <div class="card" id="out"><p class="muted">Loading…</p></div>
</div>
<script>
(function () {
  'use strict';
  var out = document.getElementById('out');
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); };
  var fmt = function (n) { return (n || 0).toLocaleString('en-GB'); };
  function load(n) {
    document.querySelectorAll('.range button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.days === n)); });
    out.innerHTML = '<p class="muted">Loading…</p>';
    fetch('/api/stats?errors=1&' + (n === 1 ? 'hours=24' : 'days=' + n), { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (d) {
      var e = d.err || [], all = e.reduce(function (t, r) { return t + r[1]; }, 0);
      document.getElementById('sub').textContent = 'The most common script errors in the game, each counted once per visit: ' + fmt(all) + ' in ' + fmt(d.visits) + ' visits.';
      out.innerHTML = e.length
        ? '<table><thead><tr><th>Error</th><th class="n">Visits</th></tr></thead><tbody>' + e.map(function (r) { return '<tr><td><code>' + esc(r[0]) + '</code></td><td class="n">' + fmt(r[1]) + '</td></tr>'; }).join('') + '</tbody></table>'
        : '<p class="muted">No errors. Nice.</p>';
    }, function () { out.innerHTML = '<p class="muted">Could not load the errors.</p>'; });
  }
  document.querySelector('.range').addEventListener('click', function (ev) { var b = ev.target.closest('button'); if (b) load(+b.dataset.days); });
  load(7);
})();
</script>
</body>
</html>
